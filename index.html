<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابخانه پرامپت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Tahoma, sans-serif; }
        .hidden { display: none; }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem; 
            line-height: 1;
            padding: 0.25rem;
            margin: 0 0.25rem;
        }
        .delete-btn { color: #ef4444; }
        .delete-btn:hover { color: #b91c1c; }
        .edit-btn { color: #3b82f6; }
        .edit-btn:hover { color: #1d4ed8; }
        
        .copy-btn {
            position: absolute;
            top: 0.25rem;
            left: 0.25rem;
            padding: 0.1rem 0.3rem;
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.25rem;
            color: #6b7280;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.75rem;
        }
        tr:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { color: #3b82f6; background-color: #f9fafb; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-6">
                <h1 class="text-3xl font-bold text-gray-800">🚀 کتابخانه پرامپت بادصبا</h1>
                <div class="flex space-x-2 space-x-reverse">
                    <button id="exportCsvButton" class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700 transition duration-300 text-sm">
                        خروجی CSV
                    </button>
                    <button id="addPromptButton" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition duration-300 text-sm">
                        + پرامپت جدید
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4">
        
        <div class="bg-white p-4 rounded-lg shadow-sm mb-6">
            <input type="text" id="searchInput" placeholder=" جستجو در پرامپت‌ها..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="w-full text-sm text-right text-gray-700 border-collapse border border-gray-300 table-fixed">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="px-4 py-3 border border-gray-300 w-[40%]">💡 متن پرامپت</th>
                        <th class="px-4 py-3 border border-gray-300 w-[70px]">👥 تیم</th> 
                        <th class="px-4 py-3 border border-gray-300 w-[10%]">🏷️ موضوع</th>
                        <th class="px-4 py-3 border border-gray-300 w-[10%]">🔑 کلمات</th>
                        <th class="px-4 py-3 border border-gray-300 w-[10%]">⛔ منفی</th>
                        <th class="px-4 py-3 border border-gray-300 w-[50px]">🖼️ لینک</th>
                        <th class="px-4 py-3 border border-gray-300 w-[10%]">✍️ نوت</th>
                        <th class="px-4 py-3 border border-gray-300 w-[100px]">اقدامات</th>
                    </tr>
                </thead>
                <tbody id="promptTableBody">
                    <tr id="loadingRow">
                        <td colspan="8" class="px-6 py-10 text-center text-gray-500 text-lg border border-gray-300">
                             در حال بارگذاری...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-60 overflow-y-auto h-full w-full flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-3xl max-h-full overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-5">
                <h2 id="modalTitle" class="text-2xl font-semibold">افزودن پرامپت جدید</h2>
                <button id="closeModalButton" class="text-gray-500 hover:text-gray-800 text-3xl font-bold">&times;</button>
            </div>
            
            <form id="addPromptForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="promptText" class="block text-sm font-medium text-gray-700 mb-1">💡 متن پرامپت <span class="text-red-500">*</span></label>
                        <textarea id="promptText" name="promptText" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required></textarea>
                    </div>
                    <div>
                        <label for="promptNotes" class="block text-sm font-medium text-gray-700 mb-1">✍️ یادداشت‌ها</label>
                        <textarea id="promptNotes" name="promptNotes" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label for="promptTeam" class="block text-sm font-medium text-gray-700 mb-1">👥 تیم <span class="text-red-500">*</span></label>
                        <select id="promptTeam" name="promptTeam" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="طراحی">طراحی</option>
                            <option value="مارکتینگ">مارکتینگ</option>
                            <option value="پرده آبی">پرده آبی</option>
                        </select>
                    </div>
                    <div>
                        <label for="promptOccasion" class="block text-sm font-medium text-gray-700 mb-1">🏷️ موضوع</label>
                        <input type="text" id="promptOccasion" name="promptOccasion" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="promptKeywords" class="block text-sm font-medium text-gray-700 mb-1">🔑 کلمات کلیدی</label>
                        <input type="text" id="promptKeywords" name="promptKeywords" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="promptNegative" class="block text-sm font-medium text-gray-700 mb-1">⛔ پرامپت منفی</label>
                        <input type="text" id="promptNegative" name="promptNegative" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label for="promptLink" class="block text-sm font-medium text-gray-700 mb-1">🖼️ لینک نمونه بصری</label>
                        <input type="url" id="promptLink" name="promptLink" placeholder="https://example.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ltr text-left">
                    </div>
                </div>
                <div class="flex justify-end pt-4 space-x-2 space-x-reverse">
                    <button type="button" id="cancelButton" class="bg-gray-200 text-gray-800 px-5 py-2 rounded-lg font-medium hover:bg-gray-300 transition duration-300">
                        انصراف
                    </button>
                    <button type="submit" id="saveButton" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition duration-300">
                        ذخیره
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            addDoc, 
            deleteDoc, 
            updateDoc, 
            collection, 
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

          const firebaseConfig = {
            apiKey: "AIzaSyCw3CvUnumkNgK2-uhZ1paUPetfBc-hOYs",
            authDomain: "my-prompt-library-35534.firebaseapp.com",
            projectId: "my-prompt-library-35534",
            storageBucket: "my-prompt-library-35534.firebasestorage.app",
            messagingSenderId: "374041398410",
            appId: "1:374041398410:web:8e0552f30229d8107cf173"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const promptsCollectionPath = "prompts";
        const promptsCollection = collection(db, promptsCollectionPath);

        let userId = null;
        let currentEditId = null;
        let allPrompts = [];

        const addPromptButton = document.getElementById('addPromptButton');
        const exportCsvButton = document.getElementById('exportCsvButton');
        const modal = document.getElementById('addModal');
        const closeModalButton = document.getElementById('closeModalButton');
        const cancelButton = document.getElementById('cancelButton');
        const addPromptForm = document.getElementById('addPromptForm');
        const tableBody = document.getElementById('promptTableBody');
        const searchInput = document.getElementById('searchInput');
        const modalTitle = document.getElementById('modalTitle');
        const saveButton = document.getElementById('saveButton');

        async function copyToClipboard(text, btn) {
            try {
                await navigator.clipboard.writeText(text);
                btn.textContent = 'OK!';
                setTimeout(() => { btn.textContent = '📋'; }, 1500);
            } catch (err) {
                console.error('Failed', err);
            }
        }

        function exportToCSV() {
            if (allPrompts.length === 0) {
                alert('داده‌ای وجود ندارد.');
                return;
            }

            const headers = ["متن", "تیم", "موضوع", "کلمات", "منفی", "لینک", "نوت"];
            const escapeCSV = (str) => {
                if (!str) return '""';
                let result = str.replace(/"/g, '""');
                if (result.search(/("|,|\n)/g) >= 0) {
                    result = `"${result}"`;
                }
                return result;
            };

            let csvContent = headers.join(',') + '\n';
            allPrompts.forEach(prompt => {
                const data = prompt.data;
                const row = [
                    escapeCSV(data.text),
                    escapeCSV(data.team),
                    escapeCSV(data.occasion),
                    escapeCSV(data.keywords),
                    escapeCSV(data.negative),
                    escapeCSV(data.link),
                    escapeCSV(data.notes)
                ];
                csvContent += row.join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', `prompts_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        exportCsvButton.addEventListener('click', exportToCSV);

        const showModal = () => modal.classList.remove('hidden');
        const hideModal = () => {
            modal.classList.add('hidden');
            addPromptForm.reset();
            currentEditId = null;
            modalTitle.textContent = "افزودن پرامپت جدید";
            saveButton.textContent = "ذخیره";
        };

        addPromptButton.addEventListener('click', () => {
            hideModal();
            currentEditId = null;
            document.getElementById('promptTeam').value = "طراحی";
            showModal();
        });
        closeModalButton.addEventListener('click', hideModal);
        cancelButton.addEventListener('click', hideModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) hideModal(); });

        function renderPromptRow(docSnapshot) {
            const data = docSnapshot.data();
            const row = tableBody.insertRow(-1);
            row.id = docSnapshot.id;
            row.className = 'hover:bg-gray-50 transition duration-150';

            let teamBadgeColor = "bg-gray-100 text-gray-800";
            if (data.team === "طراحی") teamBadgeColor = "bg-pink-100 text-pink-800";
            if (data.team === "مارکتینگ") teamBadgeColor = "bg-green-100 text-green-800";
            if (data.team === "پرده آبی") teamBadgeColor = "bg-blue-100 text-blue-800";

            row.innerHTML = `
                <td class="px-4 py-3 whitespace-normal break-words border border-gray-300 relative text-xs sm:text-sm">
                    <span class="prompt-text">${escapeHTML(data.text)}</span>
                    <button class="copy-btn" title="کپی">📋</button>
                </td>
                <td class="px-4 py-3 whitespace-nowrap border border-gray-300 text-center">
                    <span class="${teamBadgeColor} px-2 py-1 rounded-full text-[10px] sm:text-xs font-semibold block w-min mx-auto">
                        ${escapeHTML(data.team)}
                    </span>
                </td>
                <td class="px-4 py-3 whitespace-normal break-words border border-gray-300 text-xs">${escapeHTML(data.occasion)}</td>
                <td class="px-4 py-3 whitespace-normal break-words border border-gray-300 text-xs">${escapeHTML(data.keywords)}</td>
                <td class="px-4 py-3 whitespace-normal break-words border border-gray-300 text-xs">${escapeHTML(data.negative)}</td>
                <td class="px-4 py-3 border border-gray-300 text-center">${data.link ? `<a href="${escapeHTML(data.link)}" class="text-blue-600 hover:underline text-xs" target="_blank">🔗 لینک</a>` : ''}</td>
                <td class="px-4 py-3 whitespace-normal break-words border border-gray-300 text-xs">${escapeHTML(data.notes)}</td>
                <td class="px-4 py-3 text-center whitespace-nowrap border border-gray-300">
                    <button class="action-btn edit-btn" data-id="${docSnapshot.id}" title="ویرایش">✏️</button>
                    <button class="action-btn delete-btn" data-id="${docSnapshot.id}" title="حذف">🗑️</button>
                </td>
            `;

            row.querySelector('.delete-btn').addEventListener('click', async (e) => {
                const id = e.currentTarget.dataset.id;
                if (confirm('حذف شود؟')) {
                    try { await deleteDoc(doc(db, promptsCollectionPath, id)); } catch (error) { console.error(error); }
                }
            });

            row.querySelector('.edit-btn').addEventListener('click', (e) => {
                const id = e.currentTarget.dataset.id;
                const promptToEdit = allPrompts.find(p => p.id === id);
                if (promptToEdit) {
                    currentEditId = id;
                    modalTitle.textContent = "ویرایش پرامپت";
                    saveButton.textContent = "ذخیره تغییرات";
                    document.getElementById('promptText').value = promptToEdit.data.text || '';
                    document.getElementById('promptOccasion').value = promptToEdit.data.occasion || '';
                    document.getElementById('promptKeywords').value = promptToEdit.data.keywords || '';
                    document.getElementById('promptNegative').value = promptToEdit.data.negative || '';
                    document.getElementById('promptLink').value = promptToEdit.data.link || '';
                    document.getElementById('promptNotes').value = promptToEdit.data.notes || '';
                    document.getElementById('promptTeam').value = promptToEdit.data.team || 'طراحی';
                    showModal();
                }
            });

            row.querySelector('.copy-btn').addEventListener('click', (e) => {
                const btn = e.currentTarget;
                const textToCopy = btn.closest('td').querySelector('.prompt-text').textContent;
                copyToClipboard(textToCopy, btn);
            });
        }

        addPromptForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                text: document.getElementById('promptText').value,
                team: document.getElementById('promptTeam').value,
                occasion: document.getElementById('promptOccasion').value,
                keywords: document.getElementById('promptKeywords').value,
                negative: document.getElementById('promptNegative').value,
                link: document.getElementById('promptLink').value,
                notes: document.getElementById('promptNotes').value,
                ownerId: userId
            };

            try {
                if (currentEditId) {
                    await updateDoc(doc(db, promptsCollectionPath, currentEditId), { ...formData, updatedAt: new Date() });
                } else {
                    await addDoc(promptsCollection, { ...formData, createdAt: new Date() });
                }
                hideModal();
            } catch (error) {
                console.error(error);
            }
        });

        const filterTable = () => {
            const query = searchInput.value.toLowerCase();
            const rows = tableBody.getElementsByTagName('tr');
            for (const row of rows) {
                if (row.id === 'loadingRow' || row.id === 'emptyRow') continue; 
                const rowText = row.textContent.toLowerCase();
                row.style.display = rowText.includes(query) ? '' : 'none';
            }
        };
        searchInput.addEventListener('input', filterTable);

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        async function main() {
            try {
                await signInAnonymously(auth);
                userId = auth.currentUser?.uid;
                onSnapshot(promptsCollection, (querySnapshot) => {
                    tableBody.innerHTML = ''; 
                    if (querySnapshot.empty) {
                        tableBody.innerHTML = `<tr id="emptyRow"><td colspan="8" class="px-6 py-10 text-center text-gray-500">داده‌ای نیست.</td></tr>`;
                        allPrompts = [];
                        return;
                    }
                    const docs = querySnapshot.docs
                        .map(doc => ({ id: doc.id, data: doc.data() }))
                        .sort((a, b) => (b.data.updatedAt?.toMillis() || b.data.createdAt?.toMillis() || 0) - (a.data.updatedAt?.toMillis() || a.data.createdAt?.toMillis() || 0));
                    allPrompts = docs;
                    docs.forEach(docSnapshot => renderPromptRow({ id: docSnapshot.id, data: () => docSnapshot.data }));
                    filterTable();
                });
            } catch (error) {
                console.error(error);
            }
        }
        document.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
